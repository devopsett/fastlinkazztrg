<!DOCTYPE html>
<html lang="ms" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Azzuha Group Travel & Tours | Pautan Rasmi</title>
    
    <!-- Muat turun Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fon Google: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#679929',
                            greenHover: '#558021',
                            charcoal: '#464B4F',
                        }
                    },
                    fontFamily: { sans: ['Inter', 'sans-serif'] },
                    animation: { 'fade-in-up': 'fadeInUp 0.5s ease-out forwards' },
                    keyframes: {
                        fadeInUp: {
                            '0%': { opacity: '0', transform: 'translateY(12px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        };
    </script>
</head>
<body class="relative overflow-x-hidden bg-gradient-to-br from-[#eef5e6] via-[#f8faf7] to-[#e6ece4] dark:from-[#121513] dark:via-[#181b19] dark:to-[#1d221e] text-[#464B4F] dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-[#679929] selection:text-white transition-colors duration-300">

    <!-- Latar Belakang Cahaya Ambien (Glassmorphism) -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -left-20 w-80 h-80 sm:w-96 sm:h-96 rounded-full bg-[#679929]/25 dark:bg-[#679929]/20 blur-3xl"></div>
        <div class="absolute top-1/3 -right-24 w-80 h-80 sm:w-96 sm:h-96 rounded-full bg-[#86be3b]/20 dark:bg-[#86be3b]/15 blur-3xl"></div>
        <div class="absolute -bottom-24 left-1/4 w-80 h-80 sm:w-96 sm:h-96 rounded-full bg-[#464B4F]/15 dark:bg-[#464B4F]/30 blur-3xl"></div>
    </div>

    <!-- Bar Atas: Butang Kongsi & Tukar Tema -->
    <header class="w-full max-w-md mx-auto px-4 pt-6 flex justify-between items-center">
        <button id="shareBtn" type="button" aria-label="Salin pautan profil" class="px-3.5 py-2 rounded-full bg-white/60 dark:bg-white/10 backdrop-blur-xl border border-white/80 dark:border-white/15 shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:bg-white/80 dark:hover:bg-white/15 hover:scale-105 active:scale-95 transition-all text-[#464B4F] dark:text-slate-200 flex items-center gap-2 text-xs font-medium">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
            <span>Kongsi</span>
        </button>

        <button id="themeToggle" type="button" aria-label="Tukar mod gelap atau cerah" class="p-2.5 rounded-full bg-white/60 dark:bg-white/10 backdrop-blur-xl border border-white/80 dark:border-white/15 shadow-[0_8px_30px_rgb(0,0,0,0.04)] hover:bg-white/80 dark:hover:bg-white/15 hover:scale-105 active:scale-95 transition-all text-[#464B4F] dark:text-slate-200">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden dark:block text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 block dark:hidden text-[#464B4F]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
    </header>

    <!-- Kandungan Utama -->
    <main class="w-full max-w-md mx-auto px-4 py-6 flex-1 flex flex-col items-center">
        
        <!-- Kad Profil Glassmorphism -->
        <section class="w-full text-center mb-6 p-6 rounded-3xl bg-white/55 dark:bg-white/[0.06] backdrop-blur-xl border border-white/80 dark:border-white/15 shadow-[0_8px_32px_0_rgba(70,75,79,0.08)] animate-fade-in-up">
            <div class="relative inline-block mb-4">
                <img 
                    id="profileImgDisplay"
                    src="./logoprofil.png" 
                    onerror="this.onerror=null; this.src='https://placehold.co/160x160/679929/ffffff?text=AZ';"
                    alt="Gambar Profil" 
                    class="w-24 h-24 sm:w-28 sm:h-28 rounded-full object-contain p-1.5 bg-white/95 border-4 border-white/90 dark:border-white/20 shadow-lg mx-auto"
                >
                <span title="Akaun Disahkan" class="absolute bottom-1 right-1 bg-[#679929] text-white p-1 rounded-full border-2 border-white dark:border-[#181b19] shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20 6 9 17 4 12"/></svg>
                </span>
            </div>

            <h1 id="profileNameDisplay" class="text-xl sm:text-2xl font-bold tracking-tight text-[#464B4F] dark:text-white">
                Memuatkan...
            </h1>
            <p id="profileUsernameDisplay" class="text-xs sm:text-sm font-semibold text-[#679929] dark:text-[#86be3b] mt-0.5">
                &nbsp;
            </p>
            <p id="profileBioDisplay" class="text-sm text-[#464B4F]/85 dark:text-slate-300 mt-3 max-w-xs mx-auto leading-relaxed">
                &nbsp;
            </p>
        </section>

        <!-- Senarai Butang Pautan Utama (Live dari Google Sheets) -->
        <section id="linksContainer" class="w-full space-y-3.5 animate-fade-in-up" style="animation-delay: 0.1s;"></section>

    </main>

    <!-- Pengaki -->
    <footer class="w-full max-w-md mx-auto px-4 py-6 text-center">
        <p class="text-xs text-[#464B4F]/70 dark:text-slate-500">
            &copy; <span id="currentYear"></span> <span id="footerNameDisplay">Azzuha Group Travel & Tours</span>.
        </p>
    </footer>

    <!-- Notifikasi Toast -->
    <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 px-4 py-2.5 rounded-full bg-[#464B4F] dark:bg-white text-white dark:text-[#464B4F] text-xs font-medium shadow-xl opacity-0 pointer-events-none transition-all duration-300 flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-[#86be3b] dark:text-[#679929]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="toastMessage">Pautan berjaya disalin!</span>
    </div>

    <script>
        // URL WEB APP GOOGLE APPS SCRIPT ANDA:
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmddTfdPk_ZyvhnUjbXqAq_zQSPRfnbmZIzqMtRL3LZE9x1W6HDWWys_R_8bSDwBn5/exec";

        // Gambar lalai terus dari repositori GitHub
        const GAMBAR_GITHUB_LALAI = "./logoprofil.png";

        const pustakaIkon = {
            whatsapp: `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
            web: `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
            shop: `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>`,
            download: `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>`,
            telegram: `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`,
            star: `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`
        };

        function paparkanHalaman(data) {
            if (!data || !data.profil) return;

            document.getElementById('profileNameDisplay').textContent = data.profil.nama || "";
            document.getElementById('footerNameDisplay').textContent = data.profil.nama || "";
            document.getElementById('profileUsernameDisplay').textContent = data.profil.username || "";
            document.getElementById('profileBioDisplay').textContent = data.profil.bio || "";
            
            // Sentiasa guna ./logoprofil.png kecuali jika anda masukkan URL penuh (https://...)
            const imgEl = document.getElementById('profileImgDisplay');
            const urlDariSheet = (data.profil.gambar || "").trim();
            const gambarProfil = (urlDariSheet.startsWith('http://') || urlDariSheet.startsWith('https://')) 
                ? urlDariSheet 
                : GAMBAR_GITHUB_LALAI;
            
            imgEl.onerror = function() {
                if (!this.src.endsWith('logoprofil.png')) {
                    this.src = GAMBAR_GITHUB_LALAI;
                } else {
                    this.onerror = null;
                    this.src = 'https://placehold.co/160x160/679929/ffffff?text=AZ';
                }
            };
            imgEl.src = gambarProfil;
            if (data.profil.nama) {
                document.title = `${data.profil.nama} | Pautan Rasmi`;
            }

            const container = document.getElementById('linksContainer');
            const senarai = data.pautan || [];

            if (senarai.length === 0) {
                container.innerHTML = `<div class="p-6 text-center rounded-2xl bg-white/50 dark:bg-white/[0.05] backdrop-blur-md border border-white/70 dark:border-white/10 text-xs text-[#464B4F]/75 dark:text-slate-300">Tiada pautan dipaparkan buat masa ini.</div>`;
                return;
            }

            container.innerHTML = senarai.map(item => {
                const kelasButang = item.sorotan
                    ? "bg-[#679929]/90 hover:bg-[#679929] backdrop-blur-xl text-white border-white/40 shadow-[0_8px_25px_rgba(103,153,41,0.3)] hover:shadow-[0_10px_30px_rgba(103,153,41,0.45)]"
                    : "bg-white/60 dark:bg-white/[0.07] hover:bg-white/85 dark:hover:bg-white/[0.12] backdrop-blur-xl text-[#464B4F] dark:text-slate-100 border-white/80 dark:border-white/15 hover:border-[#679929]/60 dark:hover:border-[#86be3b]/60 shadow-[0_8px_24px_rgba(70,75,79,0.06)]";

                const kelasIkon = item.sorotan
                    ? "bg-white/25 text-white border border-white/30"
                    : "bg-[#679929]/15 dark:bg-[#679929]/25 text-[#679929] dark:text-[#86be3b] border border-[#679929]/20 group-hover:bg-[#679929] group-hover:text-white";

                const kelasSubtajuk = item.sorotan
                    ? "text-white/90"
                    : "text-[#464B4F]/75 dark:text-slate-300/80";

                const svgIkon = pustakaIkon[item.jenisIkon] || pustakaIkon.web;

                return `
                    <a href="${item.url}" target="_blank" rel="noopener noreferrer" 
                       class="group flex items-center justify-between w-full p-3.5 sm:p-4 rounded-2xl border transition-all duration-200 hover:-translate-y-0.5 active:scale-[0.98] ${kelasButang}">
                        <div class="flex items-center gap-3.5 min-w-0">
                            <div class="w-10 h-10 rounded-xl flex items-center justify-center shrink-0 transition-colors ${kelasIkon}">
                                ${svgIkon}
                            </div>
                            <div class="text-left truncate">
                                <div class="text-sm font-semibold truncate">${item.tajuk}</div>
                                ${item.subtajuk ? `<div class="text-xs truncate mt-0.5 ${kelasSubtajuk}">${item.subtajuk}</div>` : ''}
                            </div>
                        </div>
                        <div class="pl-2 shrink-0 opacity-60 group-hover:opacity-100 group-hover:translate-x-0.5 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                        </div>
                    </a>
                `;
            }).join('');
        }

        function paparkanSkeleton() {
            const container = document.getElementById('linksContainer');
            container.innerHTML = [1, 2, 3].map(() => `
                <div class="w-full h-16 rounded-2xl bg-white/40 dark:bg-white/[0.05] backdrop-blur-md border border-white/60 dark:border-white/10 animate-pulse"></div>
            `).join('');
        }

        async function muatDataLive() {
            const cacheTempatan = localStorage.getItem('azzuha_live_cache');
            if (cacheTempatan) {
                paparkanHalaman(JSON.parse(cacheTempatan));
            } else {
                paparkanSkeleton();
            }

            try {
                const res = await fetch(GOOGLE_SCRIPT_URL + "?t=" + new Date().getTime());
                const json = await res.json();
                if (json.status === "success" && json.data) {
                    localStorage.setItem('azzuha_live_cache', JSON.stringify(json.data));
                    paparkanHalaman(json.data);
                }
            } catch (err) {
                if (!cacheTempatan) {
                    document.getElementById('linksContainer').innerHTML = `<div class="p-6 text-center rounded-2xl bg-white/50 dark:bg-white/[0.05] backdrop-blur-md border border-white/70 dark:border-white/10 text-xs text-[#464B4F]/75 dark:text-slate-300">Gagal memuatkan data daripada Google Sheets. Sila segar semula halaman.</div>`;
                }
            }
        }

        function inisialisasiTema() {
            const htmlEl = document.documentElement;
            const savedTheme = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;

            if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
                htmlEl.classList.add('dark');
            }

            document.getElementById('themeToggle').addEventListener('click', () => {
                htmlEl.classList.toggle('dark');
                localStorage.setItem('theme', htmlEl.classList.contains('dark') ? 'dark' : 'light');
            });
        }

        function salinPautanHalaman() {
            const urlSemasa = window.location.href;
            if (navigator.share) {
                navigator.share({ title: document.title, url: urlSemasa }).catch(() => {});
                return;
            }
            const tempInput = document.createElement('input');
            tempInput.value = urlSemasa;
            document.body.appendChild(tempInput);
            tempInput.select();
            try {
                document.execCommand('copy');
                const toast = document.getElementById('toastNotification');
                toast.classList.remove('opacity-0', 'pointer-events-none');
                toast.classList.add('opacity-100', '-translate-y-1');
                setTimeout(() => {
                    toast.classList.remove('opacity-100', '-translate-y-1');
                    toast.classList.add('opacity-0', 'pointer-events-none');
                }, 2500);
            } catch (err) {}
            document.body.removeChild(tempInput);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('currentYear').textContent = new Date().getFullYear();
            inisialisasiTema();
            muatDataLive();
            document.getElementById('shareBtn').addEventListener('click', salinPautanHalaman);
        });
    </script>
</body>
</html>

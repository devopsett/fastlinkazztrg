<!DOCTYPE html>
<html lang="ms" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AI Database Assistant</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      background: radial-gradient(circle at top left, #0f172a, #020617);
    }
    .glass {
      background: rgba(30, 41, 59, 0.65);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    /* Sembunyikan scrollbar tetapi kekalkan fungsi skrol */
    #chat-box::-webkit-scrollbar { width: 6px; }
    #chat-box::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.2); border-radius: 9999px; }
  </style>
</head>
<body class="text-slate-100 min-h-screen flex items-center justify-center p-3 sm:p-6 font-sans">

  <div class="glass w-full max-w-2xl h-[90vh] rounded-2xl shadow-2xl flex flex-col overflow-hidden">
    
    <!-- Header -->
    <div class="p-4 border-b border-slate-700/60 flex items-center justify-between bg-slate-900/40">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-emerald-400 animate-pulse"></div>
        <div>
          <h1 class="font-semibold text-base sm:text-lg tracking-wide">AI Knowledge Assistant</h1>
          <p class="text-xs text-slate-400">Berhubung terus ke pangkalan data Google Sheets</p>
        </div>
      </div>
      <button onclick="clearChat()" class="text-xs text-slate-400 hover:text-white px-3 py-1.5 rounded-lg bg-slate-800/70 transition">
        Padam Sembang
      </button>
    </div>

    <!-- Ruangan Mesej -->
    <div id="chat-box" class="flex-1 p-4 overflow-y-auto space-y-4">
      <!-- Mesej Aluan -->
      <div class="flex items-start gap-2.5">
        <div class="bg-slate-800/90 border border-slate-700/50 text-slate-200 px-4 py-3 rounded-2xl rounded-tl-none max-w-[85%] text-sm leading-relaxed">
          Assalamualaikum & salam sejahtera! Sila tanya apa sahaja soalan berkaitan maklumat dalam pangkalan data kami.
        </div>
      </div>
    </div>

    <!-- Borang Input -->
    <form id="chat-form" class="p-3 sm:p-4 border-t border-slate-700/60 bg-slate-900/50 flex gap-2">
      <input 
        type="text" 
        id="user-input" 
        placeholder="Taip soalan anda di sini..." 
        required
        autocomplete="off"
        class="flex-1 bg-slate-800/80 border border-slate-700 text-white text-sm rounded-xl px-4 py-3 focus:outline-none focus:border-sky-500 transition"
      />
      <button 
        type="submit" 
        id="send-btn"
        class="bg-sky-600 hover:bg-sky-500 disabled:opacity-50 text-white font-medium text-sm px-5 py-3 rounded-xl transition flex items-center gap-2 shrink-0"
      >
        <span>Hantar</span>
      </button>
    </form>

  </div>

  <script>
    // Gantikan dengan Web App URL daripada Google Apps Script anda
    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwcMQ2AKBX291OKGqLvNrhT4Hnu280nJNU6LclZ7BqKOEsXhlFMW31CxO5AS1hiRjZQ/exec";

    const chatForm = document.getElementById("chat-form");
    const userInput = document.getElementById("user-input");
    const chatBox = document.getElementById("chat-box");
    const sendBtn = document.getElementById("send-btn");

    chatForm.addEventListener("submit", async (e) => {
      e.preventDefault();
      const question = userInput.value.trim();
      if (!question) return;

      // Papar mesej pengguna
      appendMessage(question, "user");
      userInput.value = "";
      setLoading(true);

      // Papar indikator menaip
      const loadingId = appendLoadingBubble();

      try {
        // Nota: Apps Script memerlukan text/plain untuk mengelakkan isu CORS preflight
        const response = await fetch(APPS_SCRIPT_URL, {
          method: "POST",
          headers: { "Content-Type": "text/plain;charset=utf-8" },
          body: JSON.stringify({ question: question })
        });

        const data = await response.json();
        removeElement(loadingId);

        if (data.status === "success") {
          appendMessage(data.reply, "ai");
        } else {
          appendMessage("Ralat sistem: " + data.message, "ai");
        }
      } catch (error) {
        removeElement(loadingId);
        appendMessage("Gagal berhubung dengan pelayan. Sila semak sambungan atau URL Apps Script.", "ai");
      } finally {
        setLoading(false);
        userInput.focus();
      }
    });

    function appendMessage(text, sender) {
      const wrapper = document.createElement("div");
      wrapper.className = sender === "user" ? "flex justify-end" : "flex items-start gap-2.5";

      const bubble = document.createElement("div");
      if (sender === "user") {
        bubble.className = "bg-sky-600 text-white px-4 py-3 rounded-2xl rounded-tr-none max-w-[85%] text-sm leading-relaxed shadow-md";
      } else {
        bubble.className = "bg-slate-800/90 border border-slate-700/50 text-slate-200 px-4 py-3 rounded-2xl rounded-tl-none max-w-[85%] text-sm leading-relaxed whitespace-pre-line shadow-md";
      }

      bubble.textContent = text;
      wrapper.appendChild(bubble);
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
    }

    function appendLoadingBubble() {
      const id = "loading-" + Date.now();
      const wrapper = document.createElement("div");
      wrapper.id = id;
      wrapper.className = "flex items-start gap-2.5";
      wrapper.innerHTML = `
        <div class="bg-slate-800/90 border border-slate-700/50 text-slate-400 px-4 py-3 rounded-2xl rounded-tl-none text-sm flex items-center gap-1.5">
          <span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce"></span>
          <span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.15s"></span>
          <span class="w-2 h-2 bg-slate-400 rounded-full animate-bounce" style="animation-delay: 0.3s"></span>
        </div>
      `;
      chatBox.appendChild(wrapper);
      chatBox.scrollTop = chatBox.scrollHeight;
      return id;
    }

    function removeElement(id) {
      const el = document.getElementById(id);
      if (el) el.remove();
    }

    function setLoading(isLoading) {
      userInput.disabled = isLoading;
      sendBtn.disabled = isLoading;
    }

    function clearChat() {
      chatBox.innerHTML = `
        <div class="flex items-start gap-2.5">
          <div class="bg-slate-800/90 border border-slate-700/50 text-slate-200 px-4 py-3 rounded-2xl rounded-tl-none max-w-[85%] text-sm leading-relaxed">
            Sejarah sembang telah dipadam. Sila ajukan soalan baharu.
          </div>
        </div>
      `;
    }
  </script>
</body>
</html>

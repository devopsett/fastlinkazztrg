<!DOCTYPE html>
<html lang="ms" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast-Link | Azzuha Terengganu</title>
    
    <!-- Muat turun Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Fon Google: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        };
    </script>
    <style>
        @keyframes munculLancar {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stagger-item {
            animation: munculLancar 0.45s cubic-bezier(0.16, 1, 0.3, 1) both;
        }
    </style>
</head>
<body class="relative overflow-x-hidden bg-gradient-to-br from-[#eef5e6] via-[#f8faf7] to-[#e6ece4] dark:from-[#121513] dark:via-[#181b19] dark:to-[#1d221e] text-[#464B4F] dark:text-slate-100 font-sans antialiased min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- Latar Belakang Cahaya Ambien (Glassmorphism) -->
    <div class="fixed inset-0 -z-10 overflow-hidden pointer-events-none">
        <div class="absolute -top-24 -left-20 w-80 h-80 sm:w-96 sm:h-96 rounded-full bg-[#679929]/25 dark:bg-[#679929]/20 blur-3xl"></div>
        <div class="absolute top-1/3 -right-24 w-80 h-80 sm:w-96 sm:h-96 rounded-full bg-[#86be3b]/20 dark:bg-[#86be3b]/15 blur-3xl"></div>
        <div class="absolute -bottom-24 left-1/4 w-80 h-80 sm:w-96 sm:h-96 rounded-full bg-[#464B4F]/15 dark:bg-[#464B4F]/30 blur-3xl"></div>
    </div>

    <!-- Bar Atas: Butang Kongsi & Penukar Tema -->
    <header class="w-full max-w-lg mx-auto px-4 pt-6 flex items-center justify-between">
        <button id="sharePageBtn" type="button" aria-label="Kongsi pautan halaman ini" class="inline-flex items-center gap-2 px-3.5 py-2 rounded-full text-xs font-medium bg-white/60 dark:bg-white/[0.08] backdrop-blur-xl border border-white/80 dark:border-white/15 shadow-sm hover:bg-white/80 dark:hover:bg-white/15 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5 text-[#679929] dark:text-[#86be3b]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" x2="15.42" y1="13.51" y2="17.49"/><line x1="15.41" x2="8.59" y1="6.51" y2="10.49"/></svg>
            <span>Kongsi</span>
        </button>

        <button id="themeToggle" type="button" aria-label="Tukar mod gelap atau cerah" class="p-2.5 rounded-full bg-white/60 dark:bg-white/[0.08] backdrop-blur-xl border border-white/80 dark:border-white/15 shadow-sm hover:bg-white/80 dark:hover:bg-white/15 transition-all">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 hidden dark:block text-amber-400" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 block dark:hidden text-[#464B4F]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        </button>
    </header>

    <!-- Kandungan Utama (Mobile-First) -->
    <main class="w-full max-w-lg mx-auto px-4 py-6 flex-1 flex flex-col items-center">
        
        <!-- Kad Profil (Glassmorphism) -->
        <section style="animation-delay: 0ms" class="stagger-item w-full text-center mb-7 p-6 sm:p-7 rounded-3xl bg-white/60 dark:bg-white/[0.06] backdrop-blur-xl border border-white/80 dark:border-white/15 shadow-[0_8px_32px_rgba(70,75,79,0.08)]">
            <div class="relative inline-block mb-4">
                <img id="profileImgDisplay" src="./logoprofil.png" onerror="this.onerror=null;this.src='https://placehold.co/160x160/679929/ffffff?text=AZZUHA';" alt="Logo Azzuha" class="w-24 h-24 sm:w-28 sm:h-28 rounded-full object-contain bg-white/95 p-2.5 border-2 border-white dark:border-white/25 shadow-lg mx-auto">
                <span title="Akaun Rasmi" class="absolute bottom-1 right-1 w-6 h-6 bg-[#679929] text-white rounded-full flex items-center justify-center ring-2 ring-white dark:ring-[#181b19] shadow-sm">
                    <svg xmlns="http://www.w3.org/2000/svg" class="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
                </span>
            </div>

            <h1 id="profileNameDisplay" class="text-xl sm:text-2xl font-bold tracking-tight text-[#464B4F] dark:text-white">
                Azzuha Group Travel & Tours
            </h1>
            <p id="profileUsernameDisplay" class="text-xs sm:text-sm font-semibold text-[#679929] dark:text-[#86be3b] mt-0.5">
                @azzuhatravel
            </p>
            <p id="profileBioDisplay" class="text-sm text-[#464B4F]/85 dark:text-slate-300 mt-3 max-w-sm mx-auto leading-relaxed">
                Pakej Umrah, Haji & Pelancongan Muslim Pilihan Anda. Hubungi atau terokai pautan rasmi di bawah.
            </p>
        </section>

        <!-- Senarai Butang Pautan -->
        <section id="linksContainer" aria-label="Senarai pautan utama" class="w-full space-y-3.5">
            <!-- Dijana secara dinamik -->
        </section>

    </main>

    <!-- Pengaki -->
    <footer class="w-full max-w-lg mx-auto px-4 py-8 text-center">
        <p class="text-xs text-[#464B4F]/70 dark:text-slate-400">
            &copy; <span id="currentYear"></span> <span id="footerNameDisplay" class="font-semibold text-[#679929] dark:text-[#86be3b]">Azzuha Group Travel & Tours</span> <span class="font-semibold text-[#679929] dark:text-[#86be3b]">Terengganu</span>
        </p>
    </footer>

    <!-- Notifikasi Toast -->
    <div id="toastNotification" class="fixed bottom-6 left-1/2 -translate-x-1/2 translate-y-2 z-50 px-4 py-2.5 rounded-full bg-[#464B4F] dark:bg-white text-white dark:text-[#464B4F] text-xs font-medium shadow-xl opacity-0 pointer-events-none transition-all duration-300 ease-out flex items-center gap-2">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4 text-[#86be3b] dark:text-[#679929]" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        <span id="toastMessage">Pautan berjaya disalin!</span>
    </div>

    <script>
        // URL WEB APP GOOGLE APPS SCRIPT ANDA:
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxmddTfdPk_ZyvhnUjbXqAq_zQSPRfnbmZIzqMtRL3LZE9x1W6HDWWys_R_8bSDwBn5/exec";

        let rekodDataSemasa = "";
        let toastTimeoutId = null;

        const dataSandaranAwal = {
            profil: {
                nama: "Azzuha Group Travel & Tours",
                username: "@azzuhatravel",
                bio: "Pakej Umrah, Haji & Pelancongan Muslim Pilihan Anda. Hubungi atau terokai pautan rasmi di bawah.",
                gambar: "./logoprofil.png"
            },
            pautan: [
                {
                    tajuk: "Pertanyaan & Tempahan WhatsApp",
                    subtajuk: "Berhubung terus dengan perunding umrah kami",
                    url: "https://wa.me/60123456789",
                    jenisIkon: "whatsapp",
                    sorotan: true
                },
                {
                    tajuk: "Laman Web Rasmi Azzuha",
                    subtajuk: "Lihat jadual penerbangan & senarai pakej penuh",
                    url: "https://azzuhatravel.com",
                    jenisIkon: "web",
                    sorotan: false
                }
            ]
        };

        const pustakaIkon = {
            whatsapp: `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72 12.84 12.84 0 0 0 .7 2.81 2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45 12.84 12.84 0 0 0 2.81.7A2 2 0 0 1 22 16.92z"/></svg>`,
            web: `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" x2="22" y1="12" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>`,
            shop: `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 2 3 6v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6l-3-4Z"/><path d="M3 6h18"/><path d="M16 10a4 4 0 0 1-8 0"/></svg>`,
            download: `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" x2="12" y1="15" y2="3"/></svg>`,
            telegram: `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="22" x2="11" y1="2" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>`,
            star: `<svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></svg>`
        };

        function janaCapData(data) {
            if (!data) return "";
            const p = data.profil || {};
            const senarai = (data.pautan || []).map(item => `${item.tajuk}|${item.subtajuk}|${item.url}|${item.jenisIkon}|${!!item.sorotan}`).join(";;");
            return `${p.nama}|${p.username}|${p.bio}|${p.gambar}::${senarai}`;
        }

        function paparkanHalaman(data, denganAnimasi = true) {
            if (!data) return;

            if (data.profil) {
                if (data.profil.nama) {
                    document.getElementById('profileNameDisplay').textContent = data.profil.nama;
                    document.getElementById('footerNameDisplay').textContent = data.profil.nama;
                }
                if (data.profil.username) {
                    document.getElementById('profileUsernameDisplay').textContent = data.profil.username;
                }
                if (data.profil.bio) {
                    document.getElementById('profileBioDisplay').textContent = data.profil.bio;
                }
                
                const urlDariSheet = (data.profil.gambar || "").trim();
                if (urlDariSheet.startsWith('http://') || urlDariSheet.startsWith('https://')) {
                    document.getElementById('profileImgDisplay').src = urlDariSheet;
                }
            }

            document.title = "Fast-Link | Azzuha Terengganu";

            const container = document.getElementById('linksContainer');
            if (!data.pautan || data.pautan.length === 0) {
                container.innerHTML = `<div class="p-6 text-center rounded-2xl bg-white/50 dark:bg-white/[0.05] backdrop-blur-md border border-white/70 dark:border-white/10 text-xs text-[#464B4F]/80 dark:text-slate-300 ${denganAnimasi ? 'stagger-item' : ''}">Tiada pautan dipaparkan buat masa ini.</div>`;
                return;
            }

            container.innerHTML = data.pautan.map((item, idx) => {
                const ikonHtml = pustakaIkon[item.jenisIkon] || pustakaIkon.web;
                const delayStyle = denganAnimasi ? `style="animation-delay: ${(idx + 1) * 65}ms"` : '';
                const animClass = denganAnimasi ? 'stagger-item' : '';

                if (item.sorotan) {
                    return `
                        <a href="${item.url}" target="_blank" rel="noopener noreferrer" ${delayStyle}
                           class="${animClass} group relative flex items-center justify-between w-full p-4 rounded-2xl bg-[#679929]/90 hover:bg-[#558021] backdrop-blur-xl text-white border border-white/40 shadow-[0_8px_24px_rgba(103,153,41,0.3)] hover:shadow-[0_12px_28px_rgba(103,153,41,0.4)] hover:-translate-y-0.5 active:scale-[0.99] transition-all duration-200">
                            <div class="w-10 h-10 rounded-xl bg-white/20 backdrop-blur-sm flex items-center justify-center shrink-0">
                                ${ikonHtml}
                            </div>
                            <div class="flex-1 text-center px-3">
                                <span class="block font-semibold text-sm sm:text-base">${item.tajuk}</span>
                                ${item.subtajuk ? `<span class="block text-xs text-white/90 mt-0.5">${item.subtajuk}</span>` : ''}
                            </div>
                            <div class="w-8 flex justify-end opacity-80 group-hover:opacity-100 group-hover:translate-x-0.5 transition-all">
                                <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
                            </div>
                        </a>
                    `;
                }

                return `
                    <a href="${item.url}" target="_blank" rel="noopener noreferrer" ${delayStyle}
                       class="${animClass} group flex items-center justify-between w-full p-4 rounded-2xl bg-white/60 dark:bg-white/[0.06] hover:bg-white/85 dark:hover:bg-white/[0.12] backdrop-blur-xl border border-white/80 dark:border-white/15 hover:border-[#679929]/50 dark:hover:border-[#86be3b]/50 shadow-[0_4px_20px_rgba(70,75,79,0.05)] hover:shadow-[0_8px_28px_rgba(103,153,41,0.12)] hover:-translate-y-0.5 active:scale-[0.99] transition-all duration-200">
                        <div class="w-10 h-10 rounded-xl bg-[#679929]/15 dark:bg-[#679929]/25 text-[#679929] dark:text-[#86be3b] flex items-center justify-center shrink-0 group-hover:bg-[#679929] group-hover:text-white transition-colors">
                            ${ikonHtml}
                        </div>
                        <div class="flex-1 text-center px-3">
                            <span class="block font-semibold text-sm sm:text-base text-[#464B4F] dark:text-slate-100">${item.tajuk}</span>
                            ${item.subtajuk ? `<span class="block text-xs text-[#464B4F]/75 dark:text-slate-400 mt-0.5">${item.subtajuk}</span>` : ''}
                        </div>
                        <div class="w-8 flex justify-end text-[#464B4F]/50 dark:text-slate-400 group-hover:text-[#679929] dark:group-hover:text-[#86be3b] group-hover:translate-x-0.5 transition-all">
                            <svg xmlns="http://www.w3.org/2000/svg" class="w-4 h-4" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
                        </div>
                    </a>
                `;
            }).join('');
        }

        async function muatDataLive(isAutoSync = false) {
            if (!isAutoSync) {
                const cacheTempatan = localStorage.getItem('azzuha_live_cache');
                if (cacheTempatan) {
                    try {
                        const parsed = JSON.parse(cacheTempatan);
                        rekodDataSemasa = janaCapData(parsed);
                        paparkanHalaman(parsed, true);
                    } catch (e) {
                        rekodDataSemasa = janaCapData(dataSandaranAwal);
                        paparkanHalaman(dataSandaranAwal, true);
                    }
                } else {
                    rekodDataSemasa = janaCapData(dataSandaranAwal);
                    paparkanHalaman(dataSandaranAwal, true);
                }
            }

            try {
                const res = await fetch(GOOGLE_SCRIPT_URL + "?t=" + Date.now(), {
                    method: "GET",
                    redirect: "follow"
                });
                if (!res.ok) throw new Error("HTTP " + res.status);
                const text = await res.text();
                const json = JSON.parse(text);

                if (json.status === "success" && json.data) {
                    const capBaharu = janaCapData(json.data);
                    if (capBaharu !== rekodDataSemasa) {
                        rekodDataSemasa = capBaharu;
                        localStorage.setItem('azzuha_live_cache', JSON.stringify(json.data));
                        paparkanHalaman(json.data, false);
                    }
                }
            } catch (err) {
                console.warn("Menggunakan paparan semasa sementara sambungan Google Sheets disegerakkan:", err.message);
            }
        }

        function tunjukNotifikasi(mesej) {
            const toast = document.getElementById('toastNotification');
            document.getElementById('toastMessage').textContent = mesej;
            if (toastTimeoutId) clearTimeout(toastTimeoutId);
            toast.classList.remove('opacity-0', 'translate-y-2', 'pointer-events-none');
            toast.classList.add('opacity-100', 'translate-y-0');
            toastTimeoutId = setTimeout(() => {
                toast.classList.remove('opacity-100', 'translate-y-0');
                toast.classList.add('opacity-0', 'translate-y-2', 'pointer-events-none');
            }, 2500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.getElementById('currentYear').textContent = new Date().getFullYear();

            const htmlEl = document.documentElement;
            if (localStorage.getItem('theme') === 'dark' || (!localStorage.getItem('theme') && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
                htmlEl.classList.add('dark');
            }
            document.getElementById('themeToggle').addEventListener('click', () => {
                htmlEl.classList.toggle('dark');
                localStorage.setItem('theme', htmlEl.classList.contains('dark') ? 'dark' : 'light');
            });

            document.getElementById('sharePageBtn').addEventListener('click', () => {
                const urlSemasa = window.location.href;
                if (navigator.share) {
                    navigator.share({ title: document.title, url: urlSemasa }).catch(() => {});
                } else {
                    const inputSementara = document.createElement('input');
                    inputSementara.value = urlSemasa;
                    document.body.appendChild(inputSementara);
                    inputSementara.select();
                    document.execCommand('copy');
                    document.body.removeChild(inputSementara);
                    tunjukNotifikasi('Pautan profil berjaya disalin!');
                }
            });

            muatDataLive(false);
            setInterval(() => muatDataLive(true), 20000);
        });
    </script>
</body>
</html>
